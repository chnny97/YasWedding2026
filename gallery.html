<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photo Gallery</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 30px;
      text-align: center;
    }

    a {
      display: inline-block;
      margin-bottom: 30px;
      font-size: 16px;
      color: #0077cc;
      text-decoration: none;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 1000px;
    }

    .gallery-item {
      position: relative;
      width: 100%;
      padding-top: 100%;
      overflow: hidden;
      border-radius: 8px;
      background-color: #eee;
      opacity: 0;
    }

    .gallery-item img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-item img:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 30px;
      height: 30px;
      margin: -15px 0 0 -15px;
      border: 4px solid #ccc;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      z-index: 1;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.98);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
    }

    .modal:target {
      display: flex;
    }

    .arrow {
      position: absolute;
      top: 50%;
      color: white;
      font-size: 30px;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .arrow:hover {
      background-color: rgba(0, 0, 0, 0.8);
    }

    .arrow-left {
      left: 10px;
    }

    .arrow-right {
      right: 10px;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 32px;
      text-decoration: none;
    }

    .pagination {
      margin-top: 20px;
      text-align: center;
    }

    .pagination button {
      background-color: #0077cc;
      color: white;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      border-radius: 5px;
    }

    .pagination button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <a href="index.html">📷 Go Back to Upload</a>
  <h1>Uploaded Photos</h1>
  <div class="gallery" id="gallery">Loading...</div>

  <div id="modal" class="modal">
    <a href="#" class="close-btn">&times;</a>
    <img id="modalImage" src="" alt="Full View" />
    <span class="arrow arrow-left" id="prevArrow">&#8592;</span>
    <span class="arrow arrow-right" id="nextArrow">&#8594;</span>
  </div>

  <div class="pagination" id="pagination">
    <button id="prevPageBtn" disabled>Previous</button>
    <button id="nextPageBtn">Next</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getStorage, ref, listAll, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBBJJeHURGsBux3bUOZ0o1E9XrUr6etHBs",
      authDomain: "sarah-and-doug-2025.firebaseapp.com",
      projectId: "sarah-and-doug-2025",
      storageBucket: "sarah-and-doug-2025.firebasestorage.app",
      messagingSenderId: "1030871235471",
      appId: "1:1030871235471:web:40220c1c2a71082e2769fa",
      measurementId: "G-XJJL710JTX"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const photosRef = ref(storage, 'photos');

    const gallery = document.getElementById('gallery');
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');
    const prevArrow = document.getElementById('prevArrow');
    const nextArrow = document.getElementById('nextArrow');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');

    let images = [];
    let currentPage = 1;
    const imagesPerPage = 12;

    async function loadImages() {
      try {
        const result = await listAll(photosRef);
        images = [];

        for (const itemRef of result.items) {
          const url = await getDownloadURL(itemRef);
          images.push(url);
        }

        renderGallery();
        updatePaginationButtons();
      } catch (error) {
        console.error("Failed to load images:", error);
        gallery.innerHTML = "<p>⚠️ Could not load images. Check Firebase config or permissions.</p>";
      }
    }

    function renderGallery() {
      gallery.innerHTML = '';
      const startIdx = (currentPage - 1) * imagesPerPage;
      const endIdx = Math.min(startIdx + imagesPerPage, images.length);

      for (let i = startIdx; i < endIdx; i++) {
        const fullImageUrl = images[i];

        const galleryItem = document.createElement('div');
        galleryItem.classList.add('gallery-item', 'fade-in');

        const spinner = document.createElement('div');
        spinner.classList.add('spinner');

        const img = document.createElement('img');
        img.src = fullImageUrl;
        img.alt = "Uploaded photo";
        img.onload = () => {
          spinner.remove();
          img.style.display = 'block';
        };
        img.addEventListener('click', () => openModal(fullImageUrl, images.indexOf(fullImageUrl)));

        galleryItem.appendChild(spinner);
        galleryItem.appendChild(img);
        gallery.appendChild(galleryItem);
      }
    }

    function openModal(url, index) {
      modalImage.src = url;
      window.location.hash = 'modal';
    }

    function updatePaginationButtons() {
      prevPageBtn.disabled = currentPage === 1;
      nextPageBtn.disabled = currentPage * imagesPerPage >= images.length;
    }

    prevPageBtn.addEventListener('click', () => {
      currentPage--;
      renderGallery();
      updatePaginationButtons();
    });

    nextPageBtn.addEventListener('click', () => {
      currentPage++;
      renderGallery();
      updatePaginationButtons();
    });

    loadImages();
  </script>
</body>
</html>
