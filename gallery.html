<!DOCTYPE html>
<html>
<head>
  <title>Photo Gallery</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
      background: #f9f9f9;
    }

    h1 {
      margin-bottom: 20px;
    }

    a {
      display: inline-block;
      margin-bottom: 20px;
      color: #0077cc;
      text-decoration: none;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }

    .gallery img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s ease;
    }

    .gallery img:hover {
      transform: scale(1.03);
    }

    /* Fullscreen Modal */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
    }

    .modal:target {
      display: flex;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 32px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <a href="index.html">📷 Go Back to Upload</a>
  <h1>Uploaded Photos</h1>
  <div class="gallery" id="gallery">Loading...</div>

  <!-- Fullscreen Modal Viewer -->
  <div id="modal" class="modal">
    <a href="#" class="close-btn">&times;</a>
    <img id="modalImage" src="" alt="Full View">
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getStorage, ref, listAll, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const photosRef = ref(storage, 'photos');

    const gallery = document.getElementById('gallery');
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');

    gallery.innerHTML = '';

    async function loadImages() {
      try {
        const result = await listAll(photosRef);
        for (const itemRef of result.items) {
          const url = await getDownloadURL(itemRef);
          const img = document.createElement('img');
          img.src = url;
          img.alt = "Uploaded photo";
          img.addEventListener('click', () => {
            modalImage.src = url;
            window.location.hash = 'modal';
          });
          gallery.appendChild(img);
        }

        if (result.items.length === 0) {
          gallery.innerHTML = "<p>No photos uploaded yet.</p>";
        }
      } catch (error) {
        console.error("Failed to load images:", error);
        gallery.innerHTML = "<p>⚠️ Could not load images. Check Firebase config or permissions.</p>";
      }
    }

    loadImages();
  </script>
</body>
</html>
