<!DOCTYPE html>
<html>
<head>
  <title>Photo Gallery</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
      background: #f9f9f9;
    }

    h1 {
      margin-bottom: 20px;
    }

    a {
      display: inline-block;
      margin-bottom: 20px;
      color: #0077cc;
      text-decoration: none;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }

    .gallery img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s ease;
    }

    .gallery img:hover {
      transform: scale(1.03);
    }

    /* Fullscreen Modal */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
    }

    .modal:target {
      display: flex;
    }

    /* Arrows for navigation */
    .arrow {
      position: absolute;
      top: 50%;
      color: white;
      font-size: 30px;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .arrow:hover {
      background-color: rgba(0, 0, 0, 0.8);
    }

    .arrow-left {
      left: 10px;
    }

    .arrow-right {
      right: 10px;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 32px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <a href="index.html">📷 Go Back to Upload</a>
  <h1>Uploaded Photos</h1>
  <div class="gallery" id="gallery">Loading...</div>

  <!-- Fullscreen Modal Viewer -->
  <div id="modal" class="modal">
    <a href="#" class="close-btn">&times;</a>
    <img id="modalImage" src="" alt="Full View">
    <span class="arrow arrow-left" id="prevArrow">&#8592;</span>
    <span class="arrow arrow-right" id="nextArrow">&#8594;</span>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getStorage, ref, listAll, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBBJJeHURGsBux3bUOZ0o1E9XrUr6etHBs",
      authDomain: "sarah-and-doug-2025.firebaseapp.com",
      projectId: "sarah-and-doug-2025",
      storageBucket: "sarah-and-doug-2025.firebasestorage.app",
      messagingSenderId: "1030871235471",
      appId: "1:1030871235471:web:40220c1c2a71082e2769fa",
      measurementId: "G-XJJL710JTX"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const photosRef = ref(storage, 'photos');

    const gallery = document.getElementById('gallery');
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');
    const prevArrow = document.getElementById('prevArrow');
    const nextArrow = document.getElementById('nextArrow');
    let images = [];
    let currentIndex = 0;

    gallery.innerHTML = '';

    async function loadImages() {
      try {
        const result = await listAll(photosRef);
        images = [];
        for (const itemRef of result.items) {
          const url = await getDownloadURL(itemRef);
          images.push(url);
          
          const img = document.createElement('img');
          img.src = url;
          img.alt = "Uploaded photo";
          img.addEventListener('click', () => openModal(url, images.indexOf(url)));
          gallery.appendChild(img);
        }

        if (result.items.length === 0) {
          gallery.innerHTML = "<p>No photos uploaded yet.</p>";
        }
      } catch (error) {
        console.error("Failed to load images:", error);
        gallery.innerHTML = "<p>⚠️ Could not load images. Check Firebase config or permissions.</p>";
      }
    }

    function openModal(url, index) {
      currentIndex = index;
      modalImage.src = url;
      window.location.hash = 'modal'; // Open the modal via hash
    }

    function showNextImage() {
      if (currentIndex < images.length - 1) {
        currentIndex++;
        modalImage.src = images[currentIndex];
      }
    }

    function showPrevImage() {
      if (currentIndex > 0) {
        currentIndex--;
        modalImage.src = images[currentIndex];
      }
    }

    // Arrow event listeners
    nextArrow.addEventListener('click', showNextImage);
    prevArrow.addEventListener('click', showPrevImage);

    loadImages();
  </script>
</body>
</html>
