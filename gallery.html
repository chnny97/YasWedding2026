<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gallery — Sarah &amp; Douglas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <meta name="theme-color" content="#f4f1eb">

  <style>
    :root{
      --bg: #fbfaf8;
      --paper: #f4f1eb;
      --text: #37413a;
      --muted: #7b8574;
      --accent: #6d8e4d;
      --accent-dark: #4b6b39;
      --max-width: 1100px;
      --gutter: clamp(16px, 3.5vw, 48px);
      --radius: 12px;
      --shadow: 0 6px 24px rgba(17,18,15,0.06);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      min-height:100%;
      font-family: 'Montserrat', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:var(--text);
      background: linear-gradient(180deg, var(--bg) 0%, var(--paper) 100%);
      -webkit-font-smoothing:antialiased;
      padding: calc(var(--gutter) * 1.25);
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }

    /* Decorative artwork (left & right) */
    .artwork{position:fixed;top:0;bottom:0;width:34vw;max-width:420px;pointer-events:none;z-index:0;display:flex;align-items:center;justify-content:center}
    .artwork.left{left:0;background-image: url("https://media-api.xogrp.com/images/6b62ddcd-512a-4ad0-a92a-77882c7b807b");background-repeat:no-repeat;background-position:left center;background-size:contain;transform:translateX(-8%);opacity:.95}
    .artwork.right{right:0;background-image: url("https://media-api.xogrp.com/images/6b62ddcd-512a-4ad0-a92a-77882c7b807b");background-repeat:no-repeat;background-position:right center;background-size:contain;transform:translateX(8%) scaleX(-1);opacity:.95}

    .container{position:relative;z-index:2;max-width:var(--max-width);width:100%;margin:0 auto;text-align:center;padding: calc(var(--gutter) * 1.5) calc(var(--gutter) * 1.2);}

    header{margin-top:6vh;margin-bottom:2.25rem}
    h1{margin:0;font-family:'Playfair Display',serif;font-weight:400;letter-spacing:6px;font-size:clamp(28px,4.6vw,44px);color:var(--accent-dark);text-transform:uppercase;line-height:1}
    .lead{margin-top:.6rem;margin-bottom:1rem;color:var(--muted);font-size:clamp(13px,1.6vw,15px);letter-spacing:1px}

    nav{margin-top:1.25rem;display:flex;gap:1rem;justify-content:center;font-size:14px;color:var(--muted)}
    nav a{color:var(--muted);text-decoration:none;padding:6px 8px;border-bottom:2px solid transparent}
    nav a.active,nav a:hover{color:var(--accent-dark);border-bottom-color:var(--accent)}

    .card{background:linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.55));border-radius:var(--radius);padding:calc(var(--gutter) * 0.9);box-shadow:var(--shadow);}

    /* Gallery grid */
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:18px}
    .photo{background:#fff;border-radius:8px;overflow:hidden;display:block;border:1px solid rgba(0,0,0,0.04);box-shadow:0 8px 20px rgba(20,20,18,0.04);text-decoration:none;color:inherit}
    .photo img{width:100%;height:160px;object-fit:cover;display:block;filter:contrast(0.98) saturate(0.98)}
    .photo .caption{font-size:12px;color:var(--muted);padding:8px 10px;text-align:left}

    /* Loading spinner & fade */
    .spinner{position:relative;width:36px;height:36px;border:4px solid #e6e6e6;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:10px auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
    .fade-in{animation:fadeIn .45s ease forwards}

    .empty{color:var(--muted);margin-top:24px}

    /* Modal lightbox */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:9999;padding:24px}
    .modal.open{display:flex}
    .modal .img-wrap{max-width:1200px;width:100%;border-radius:12px;overflow:hidden}
    .modal img{width:100%;height:auto;display:block;border-radius:8px}
    .modal .close{position:absolute;top:20px;right:28px;color:white;font-size:32px;text-decoration:none}
    .arrow{position:absolute;top:50%;color:white;font-size:30px;background-color:rgba(0,0,0,0.45);padding:10px;border-radius:50%;cursor:pointer;transform:translateY(-50%)}
    .arrow:hover{background-color:rgba(0,0,0,0.65)}
    .arrow-left{left:14px}
    .arrow-right{right:14px}

    /* Pagination */
    .pagination{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
    .page-btn{background:white;border:1px solid #e6e6e6;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--text)}
    .page-btn.active{background:var(--accent);color:white;border-color:var(--accent)}
    .page-btn:disabled{opacity:.6;cursor:default}

    @media (max-width:880px){.artwork{display:none}.container{padding:0}}
    @media (max-width:420px){.photo img{height:120px}}
  </style>
</head>
<body>
  <div class="artwork left" aria-hidden="true"></div>
  <div class="artwork right" aria-hidden="true"></div>

  <main class="container">
    <header>
      <h1>SARAH &amp; DOUGLAS</h1>
      <div class="lead">Gallery</div>

      <nav aria-label="Main">
        <a href="index.html">Home</a>
        <a href="#">Our Story</a>
        <a href="#">Q + A</a>
        <a href="#">Travel</a>
        <a href="gallery.html" class="active" aria-current="page">Gallery</a>
        <a href="food.html">Food</a>
      </nav>
    </header>

    <section class="card" aria-labelledby="gallery-heading">
      <h2 id="gallery-heading" style="margin:0;font-family:'Playfair Display',serif;color:var(--accent-dark);font-size:18px">Wedding Photos</h2>
      <p id="gallery-status" class="lead" style="margin-top:8px;color:var(--muted);font-size:14px">Loading photos…</p>

      <div id="galleryGrid" class="gallery-grid" aria-live="polite">
        <div id="loading" style="grid-column:1/-1;text-align:center"><div class="spinner" aria-hidden="true"></div></div>
      </div>

      <div id="emptyMessage" class="empty" style="display:none">No photos uploaded yet. Be the first to share!</div>

      <div id="pagination" class="pagination" aria-label="Gallery pagination"></div>
    </section>
  </main>

  <!-- Modal / Lightbox -->
  <div id="modal" class="modal" aria-hidden="true" role="dialog" aria-label="Image viewer">
    <a href="#" class="close" id="closeBtn" aria-label="Close viewer">&times;</a>
    <div class="img-wrap">
      <img id="modalImage" src="" alt="Full view">
    </div>
    <button class="arrow arrow-left" id="prevBtn" aria-label="Previous">&#8592;</button>
    <button class="arrow arrow-right" id="nextBtn" aria-label="Next">&#8594;</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getStorage, ref, listAll, getDownloadURL, getMetadata } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBBJJeHURGsBux3bUOZ0o1E9XrUr6etHBs",
      authDomain: "sarah-and-doug-2025.firebaseapp.com",
      projectId: "sarah-and-doug-2025",
      storageBucket: "sarah-and-doug-2025.firebasestorage.app",
      messagingSenderId: "1030871235471",
      appId: "1:1030871235471:web:40220c1c2a71082e2769fa",
      measurementId: "G-XJJL710JTX"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const photosRef = ref(storage, 'photos/');

    const galleryGrid = document.getElementById('galleryGrid');
    const statusEl = document.getElementById('gallery-status');
    const loadingEl = document.getElementById('loading');
    const emptyEl = document.getElementById('emptyMessage');
    const paginationEl = document.getElementById('pagination');
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const closeBtn = document.getElementById('closeBtn');

    const IMAGES_PER_PAGE = 9;
    let images = []; // array of { url, name }
    let currentIndex = 0;
    let currentPage = 1;

    async function loadGallery() {
      try {
        const listResult = await listAll(photosRef);
        if (!listResult.items.length) {
          loadingEl.style.display = 'none';
          statusEl.style.display = 'none';
          emptyEl.style.display = 'block';
          return;
        }

        // fetch metadata and urls, then sort by timeCreated desc
        const items = await Promise.all(listResult.items.map(async (it) => {
          const meta = await getMetadata(it);
          const url = await getDownloadURL(it);
          return { name: it.name, url, timeCreated: meta.timeCreated };
        }));

        items.sort((a,b) => new Date(b.timeCreated) - new Date(a.timeCreated));
        images = items;
        loadingEl.style.display = 'none';
        statusEl.textContent = `Showing ${images.length} photo(s)`;
        currentPage = 1;
        renderGalleryPage();
        renderPagination();
      } catch (err) {
        console.error(err);
        loadingEl.style.display = 'none';
        statusEl.textContent = 'Unable to load photos.';
      }
    }

    function renderGalleryPage() {
      // clear grid, keep status and empty handling elsewhere
      galleryGrid.innerHTML = '';
      const start = (currentPage - 1) * IMAGES_PER_PAGE;
      const end = Math.min(start + IMAGES_PER_PAGE, images.length);

      for (let i = start; i < end; i++) {
        const item = images[i];
        const link = document.createElement('a');
        link.className = 'photo fade-in';
        link.href = item.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.setAttribute('aria-label', item.name);

        const img = document.createElement('img');
        img.src = item.url;
        img.alt = item.name;
        img.loading = 'lazy';
        img.dataset.index = i;

        const caption = document.createElement('div');
        caption.className = 'caption';

        // Friendly caption: remove timestamp-like prefix if present
        caption.textContent = item.name.replace(/^[0-9T-_:]+_?/, '').replace(/_/g, ' ');

        img.addEventListener('click', (e) => {
          e.preventDefault();
          openModal(parseInt(img.dataset.index, 10));
        });

        link.appendChild(img);
        link.appendChild(caption);
        galleryGrid.appendChild(link);
      }
    }

    function renderPagination() {
      const total = Math.ceil(images.length / IMAGES_PER_PAGE);
      paginationEl.innerHTML = '';
      if (total <= 1) return;

      const prev = document.createElement('button');
      prev.className = 'page-btn';
      prev.textContent = 'Prev';
      prev.disabled = currentPage === 1;
      prev.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderGalleryPage(); renderPagination(); window.scrollTo({top:0,behavior:'smooth'}); } });
      paginationEl.appendChild(prev);

      for (let p = 1; p <= total; p++) {
        const btn = document.createElement('button');
        btn.className = 'page-btn' + (p === currentPage ? ' active' : '');
        btn.textContent = String(p);
        btn.disabled = p === currentPage;
        btn.addEventListener('click', () => { currentPage = p; renderGalleryPage(); renderPagination(); window.scrollTo({top:0,behavior:'smooth'}); });
        paginationEl.appendChild(btn);
      }

      const next = document.createElement('button');
      next.className = 'page-btn';
      next.textContent = 'Next';
      next.disabled = currentPage === total;
      next.addEventListener('click', () => { if (currentPage < total) { currentPage++; renderGalleryPage(); renderPagination(); window.scrollTo({top:0,behavior:'smooth'}); } });
      paginationEl.appendChild(next);
    }

    function openModal(index) {
      currentIndex = index;
      modalImage.src = images[currentIndex].url;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      updateModalButtons();
    }
    function closeModal() {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      modalImage.src = '';
    }
    function showNext() {
      if (currentIndex < images.length - 1) {
        currentIndex++;
        modalImage.src = images[currentIndex].url;
        ensurePageForIndex();
        updateModalButtons();
      }
    }
    function showPrev() {
      if (currentIndex > 0) {
        currentIndex--;
        modalImage.src = images[currentIndex].url;
        ensurePageForIndex();
        updateModalButtons();
      }
    }
    function updateModalButtons() {
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === images.length - 1;
    }
    function ensurePageForIndex() {
      const page = Math.floor(currentIndex / IMAGES_PER_PAGE) + 1;
      if (page !== currentPage) {
        currentPage = page;
        renderGalleryPage();
        renderPagination();
      }
    }

    // keyboard support
    document.addEventListener('keydown', (e) => {
      if (modal.classList.contains('open')) {
        if (e.key === 'ArrowRight') showNext();
        if (e.key === 'ArrowLeft') showPrev();
        if (e.key === 'Escape') closeModal();
      }
    });

    // button handlers
    nextBtn.addEventListener('click', showNext);
    prevBtn.addEventListener('click', showPrev);
    closeBtn.addEventListener('click', (e) => { e.preventDefault(); closeModal(); });

    // close clicking outside image
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    loadGallery();
  </script>
</body>
</html>
