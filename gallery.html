<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Gallery - Sarah & Doug's Wedding 2026</title>
  <style>
    /* Same styles as before */
  </style>
</head>
<body>
  <h1>Sarah & Doug's Wedding 2026</h1>
  <h2>Uploaded Memories</h2>
  
  <p class="total-count" id="totalCount">Loading total count...</p>

  <div class="gallery" id="gallery">Loading...</div>

  <div id="modal" class="modal">
    <a href="#" class="close-btn">&times;</a>
    <img id="modalImage" src="" alt="Full View" />
    <span class="arrow arrow-left" id="prevArrow">&#8592;</span>
    <span class="arrow arrow-right" id="nextArrow">&#8594;</span>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getStorage, ref, listAll, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBBJJeHURGsBux3bUOZ0o1E9XrUr6etHBs",
      authDomain: "sarah-and-doug-2025.firebaseapp.com",
      projectId: "sarah-and-doug-2025",
      storageBucket: "sarah-and-doug-2025.firebasestorage.app",
      messagingSenderId: "1030871235471",
      appId: "1:1030871235471:web:40220c1c2a71082e2769fa",
      measurementId: "G-XJJL710JTX"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const photosRef = ref(storage, 'photos');

    const gallery = document.getElementById('gallery');
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');
    const prevArrow = document.getElementById('prevArrow');
    const nextArrow = document.getElementById('nextArrow');
    const totalCountEl = document.getElementById('totalCount');
    let images = [];
    let currentIndex = 0;

    gallery.innerHTML = '';

    async function loadImages() {
      try {
        const result = await listAll(photosRef);
        images = [];

        // Load image URLs and names
        for (const itemRef of result.items) {
          const url = await getDownloadURL(itemRef);
          images.push({ url, name: itemRef.name });
        }

        // Sort images by timestamp in file name
        images.sort((a, b) => {
          // Assuming file names have a timestamp in format: yyyy-MM-ddTHH:mm:ss (or any sortable format)
          const timestampA = a.name.split('_')[0]; // e.g., '2023-05-12T12:30:00'
          const timestampB = b.name.split('_')[0];
          return new Date(timestampB) - new Date(timestampA); // Most recent first
        });

        gallery.innerHTML = ''; // Clear any existing content

        // Display the sorted images
        for (const image of images) {
          const galleryItem = document.createElement('div');
          galleryItem.classList.add('gallery-item'); 

          const spinner = document.createElement('div');
          spinner.classList.add('spinner');

          const img = document.createElement('img');
          img.src = image.url;
          img.alt = "";  // Removed the "Uploaded photo" text
          img.onload = () => {
            spinner.remove();
            img.style.display = 'block';
          };
          img.onerror = () => {
            spinner.remove();
            console.error(`Failed to load image: ${image.url}`);
            img.style.display = 'none';
          };
          img.addEventListener('click', () => openModal(image.url, images.indexOf(image)));

          galleryItem.appendChild(spinner);
          galleryItem.appendChild(img);
          gallery.appendChild(galleryItem);
        }

        totalCountEl.textContent = `Total Memories Made: ${result.items.length}`;

        if (result.items.length === 0) {
          gallery.innerHTML = "<p>No photos uploaded yet.</p>";
        }
      } catch (error) {
        console.error("Failed to load images:", error);
        gallery.innerHTML = "<p>⚠️ Could not load images. Check Firebase config or permissions.</p>";
      }
    }

    function openModal(url, index) {
      currentIndex = index;
      modalImage.src = url;
      window.location.hash = 'modal';
    }

    function showNextImage() {
      if (currentIndex < images.length - 1) {
        currentIndex++;
        modalImage.src = images[currentIndex].url;
      }
    }

    function showPrevImage() {
      if (currentIndex > 0) {
        currentIndex--;
        modalImage.src = images[currentIndex].url;
      }
    }

    nextArrow.addEventListener('click', showNextImage);
    prevArrow.addEventListener('click', showPrevImage);

    loadImages();
  </script>
</body>
</html>
