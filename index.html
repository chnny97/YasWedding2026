<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Yasmin &amp; Aaron's Wedding 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/common.css">

  <meta name="theme-color" content="#f4f1eb">

  <style>
    :root{--shadow:0 6px 24px rgba(17,18,15,0.06)}
    *{box-sizing:border-box}html,body{height:100%}
    body{margin:0;min-height:100%;font-family:'Montserrat',system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;color:var(--text);background:linear-gradient(180deg,var(--bg) 0%,var(--paper) 100%);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;padding:calc(var(--gutter) * 1.25);display:flex;align-items:flex-start;justify-content:center}
    .container{position:relative;z-index:2;max-width:var(--max-width);width:100%;margin:0 auto;text-align:center;padding:calc(var(--gutter) * 1.5) calc(var(--gutter) * 1.2);background:rgba(255,255,255,0.0);backdrop-filter:blur(0.0px)}
    .card{margin:1.5rem auto 2rem;background:linear-gradient(180deg,rgba(255,255,255,0.6),rgba(255,255,255,0.55));border-radius:var(--radius);padding:calc(var(--gutter) * 0.9);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;align-items:center}
    .upload-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    .btn{padding:12px 22px;border-radius:10px;font-size:16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;min-width:160px;justify-content:center;text-decoration:none;border:none}
    .btn.primary{background:var(--accent);color:white;box-shadow:0 6px 18px rgba(109,142,77,0.12)}
    .btn.ghost{background:transparent;color:var(--accent-dark);border:1px solid rgba(71,83,66,0.08)}
    button:disabled{opacity:.55;cursor:default;transform:none}
    .status{font-size:14px;color:var(--muted);min-height:1.25rem}
    .progress-wrap{width:100%;max-width:560px;margin-top:6px}.progress-bar{height:12px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent-dark) 100%);width:0%;border-radius:999px;transition:width .35s ease;box-shadow:0 6px 16px rgba(75,108,67,0.12) inset}.progress-bg{height:12px;background:#ececec;border-radius:999px;overflow:hidden}
    .previews{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}.preview{width:72px;height:72px;border-radius:8px;overflow:hidden;background:#f7f6f4;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,0.03)}.preview img{width:100%;height:100%;object-fit:cover;display:block}
    .details{margin-top:2.4rem;color:var(--muted);font-size:14px;line-height:1.6}
    @media (max-width:880px){.artwork{display:none}body{padding:24px}.card{padding:18px}.container{padding:0}}
    @media (max-width:420px){h1{font-size:22px;letter-spacing:3px}.upload-actions{flex-direction:column}.preview{width:64px;height:64px}.btn{min-width:unset;width:100%}}
  </style>
</head>
<body>
  <div class="artwork left" aria-hidden="true" role="presentation"></div>
  <div class="artwork right" aria-hidden="true" role="presentation"></div>

  <main class="container" role="main">
    <header>
      <h1>YASMIN &amp; AARON</h1>
      <div class="lead">17 October 2026</div>

      <nav aria-label="Main">
        <a href="#" class="active" aria-current="page">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="drinks.html">Drinks</a>
      </nav>
    </header>

    <section class="card" aria-labelledby="upload-heading">
      <h2 id="upload-heading" style="margin:0;font-family:'Playfair Display',serif;color:var(--accent-dark);font-size:18px">Capture your memories with us</h2>
      <p class="status" id="status">Share your photos — take one now or choose from your library.</p>
      <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display:none" aria-hidden="true">
      <input type="file" accept="image/*" id="libraryInput" multiple style="display:none" aria-hidden="true">
      <div class="upload-actions" aria-hidden="false">
        <button id="takePhoto" class="btn primary" type="button">📷 Take a Photo</button>
        <button id="choosePhotos" class="btn ghost" type="button">🖼 Choose from Library</button>
      </div>
      <div class="previews" id="previews" aria-live="polite"></div>
      <div class="progress-wrap" id="progressWrap" aria-hidden="true" style="display:none">
        <div class="progress-bg" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
    </section>

    <section class="details" aria-label="Ceremony and reception preview">
      <div style="margin-top:10px; font-family:'Playfair Display',serif; color:var(--accent-dark); font-weight:400; letter-spacing:2px; font-size:16px">Reception</div>
      <div style="margin-top:6px">Add other ceremony & reception details here<br><br>Please refer to invite for address and details. <br></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getStorage, ref, uploadBytesResumable } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJbdkv6haicSTZJ5he3Y7uPO1DhVQZNEk",
      authDomain: "yasmin-s-wedding.firebaseapp.com",
      projectId: "yasmin-s-wedding",
      storageBucket: "yasmin-s-wedding.firebasestorage.app",
      messagingSenderId: "467282654791",
      appId: "1:467282654791:web:c60c1eb3d34182ff292362",
      measurementId: "G-1HM71Y4FJ6"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);

    const cameraInput = document.getElementById('cameraInput');
    const libraryInput = document.getElementById('libraryInput');
    const takePhotoBtn = document.getElementById('takePhoto');
    const choosePhotosBtn = document.getElementById('choosePhotos');
    const statusEl = document.getElementById('status');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const previewsEl = document.getElementById('previews');

    takePhotoBtn.addEventListener('click', () => cameraInput.click());
    choosePhotosBtn.addEventListener('click', () => libraryInput.click());

    cameraInput.addEventListener('change', handleUpload);
    libraryInput.addEventListener('change', handleUpload);

    function createPreview(file) {
      const container = document.createElement('div');
      container.className = 'preview';
      const img = document.createElement('img');
      img.alt = file.name || 'photo preview';
      container.appendChild(img);
      previewsEl.appendChild(container);

      const reader = new FileReader();
      reader.onload = (e) => {
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function setUploading(state) {
      takePhotoBtn.disabled = state;
      choosePhotosBtn.disabled = state;
      progressWrap.style.display = state ? 'block' : 'none';
    }

    async function handleUpload(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      previewsEl.innerHTML = '';
      for (const file of files) createPreview(file);

      statusEl.textContent = `Uploading ${files.length} file(s)...`;
      setUploading(true);
      progressBar.style.width = '0%';
      progressBar.setAttribute('aria-valuenow', '0');

      let totalBytes = 0;
      for (const f of files) totalBytes += f.size;
      let bytesTransferredOverall = 0;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        const fileRef = ref(storage, `photos/${timestamp}_${file.name}`);

        const uploadTask = uploadBytesResumable(fileRef, file);

        await new Promise((resolve, reject) => {
          uploadTask.on('state_changed', snapshot => {
            const fileProgress = snapshot.bytesTransferred;
            const overallTransferred = bytesTransferredOverall + fileProgress;
            const percent = Math.round((overallTransferred / totalBytes) * 100);
            progressBar.style.width = percent + '%';
            progressBar.setAttribute('aria-valuenow', String(percent));
          }, error => {
            console.error('Upload error', error);
            statusEl.textContent = '❌ Upload failed. Please try again.';
            setUploading(false);
            reject(error);
          }, () => {
            bytesTransferredOverall += file.size;
            const doneCount = i + 1;
            statusEl.textContent = `Uploaded ${doneCount}/${files.length} photo(s)...`;
            resolve();
          });
        }).catch((err) => {
          console.error(err);
        });
      }

      statusEl.textContent = '✅ Upload complete — thank you for sharing!';
      progressBar.style.width = '100%';
      progressBar.setAttribute('aria-valuenow', '100');
      setTimeout(() => {
        progressBar.style.width = '0%';
        progressBar.setAttribute('aria-valuenow', '0');
        setUploading(false);
      }, 1400);

      cameraInput.value = '';
      libraryInput.value = '';
    }
  </script>
</body>
</html>
