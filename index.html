<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sarah & Doug's Wedding 2026</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      padding: 30px;
      text-align: center;
      background-color: #f4f1eb;
      color: #3c3c3c;
    }

    h1 {
      font-size: 36px;
      color: #4b8c43;
      font-family: 'Palatino', serif;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    h2 {
      font-size: 22px;
      color: #6d8e4d;
      margin-top: 20px;
      font-family: 'Verdana', sans-serif;
    }

    p {
      font-size: 18px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 30px;
      font-size: 18px;
      margin: 12px 10px;
      border-radius: 8px;
      border: none;
      background-color: #6d8e4d;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Verdana', sans-serif;
    }

    button:hover {
      background-color: #4b8c43;
    }

    .status {
      margin-top: 20px;
      font-size: 20px;
      color: #333;
      font-family: 'Verdana', sans-serif;
    }

    .progress-container {
      margin-top: 20px;
      width: 100%;
      background-color: #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }

    .progress-bar {
      height: 10px;
      width: 0%;
      background-color: #6d8e4d;
      transition: width 0.4s ease;
    }

    a {
      display: block;
      margin-top: 30px;
      text-decoration: none;
      color: #4b8c43;
      font-size: 20px;
      font-family: 'Verdana', sans-serif;
    }

    a:hover {
      color: #3c6e2f;
    }

    #featured {
      margin-top: 40px;
    }

    #featured img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 28px; }
      h2 { font-size: 18px; }
      button { font-size: 16px; padding: 10px 20px; }
      .status { font-size: 18px; }
      a { font-size: 18px; }
    }
  </style>
</head>
<body>
  <h1>Sarah & Doug's Wedding 2026</h1>
  <h2>Capture your memories with us!</h2>

  <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display: none;">
  <input type="file" accept="image/*" id="libraryInput" multiple style="display: none;">

  <button onclick="document.getElementById('cameraInput').click()">📷 Take a Photo</button>
  <button onclick="document.getElementById('libraryInput').click()">🖼 Choose from Library</button>

  <div class="status" id="status"></div>

  <div class="progress-container" id="progressContainer" style="display: none;">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <a href="gallery.html">📸 View Uploaded Gallery</a>

  <!-- Featured Photo -->
  <div id="featured">
    <h2>🌟 Featured Photo</h2>
    <img id="featuredImage" src="" alt="Featured" />
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import {
      getStorage,
      ref,
      uploadBytesResumable,
      listAll,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBBJJeHURGsBux3bUOZ0o1E9XrUr6etHBs",
      authDomain: "sarah-and-doug-2025.firebaseapp.com",
      projectId: "sarah-and-doug-2025",
      storageBucket: "sarah-and-doug-2025.firebasestorage.app",
      messagingSenderId: "1030871235471",
      appId: "1:1030871235471:web:40220c1c2a71082e2769fa",
      measurementId: "G-XJJL710JTX"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const statusEl = document.getElementById('status');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');

    document.getElementById('cameraInput').addEventListener('change', handleUpload);
    document.getElementById('libraryInput').addEventListener('change', handleUpload);

    async function handleUpload(event) {
      const files = event.target.files;
      if (!files.length) return;

      progressContainer.style.display = 'block';
      statusEl.textContent = 'Uploading...';

      let uploadedCount = 0;

      for (const file of files) {
        const timestamp = new Date().toISOString();
        const fileRef = ref(storage, 'photos/' + timestamp + '_' + file.name);

        const uploadTask = uploadBytesResumable(fileRef, file);

        uploadTask.on('state_changed', (snapshot) => {
          const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
          progressBar.style.width = progress + '%';
        }, (error) => {
          console.error(error);
          statusEl.textContent = '❌ Upload failed.';
        }, () => {
          uploadedCount++;
          if (uploadedCount === files.length) {
            statusEl.textContent = '✅ Upload successful! Thanks for making a special memory with us!';
            progressContainer.style.display = 'none';
          }
        });
      }
    }

    async function loadFeaturedPhoto() {
      const photosRef = ref(storage, 'photos/');
      try {
        const result = await listAll(photosRef);
        const items = result.items;
        if (items.length === 0) {
          document.getElementById('featuredImage').alt = 'No photos yet!';
          return;
        }
        const randomIndex = Math.floor(Math.random() * items.length);
        const randomRef = items[randomIndex];
        const url = await getDownloadURL(randomRef);
        document.getElementById('featuredImage').src = url;
      } catch (err) {
        console.error('Error fetching featured photo:', err);
        document.getElementById('featuredImage').alt = 'Unable to load featured photo.';
      }
    }

    loadFeaturedPhoto();
  </script>
</body>
</html>
