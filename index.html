<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photo Upload</title>
  <style>
    /* General body styles */
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f0f4f1;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      text-align: center;
      color: #3b5c3b;
    }

    .featured-photo {
      margin-bottom: 30px;
      text-align: center;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .featured-photo img {
      max-width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    /* Form styles */
    .upload-form {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .upload-form input[type="file"] {
      margin-bottom: 20px;
    }

    .upload-btn {
      padding: 10px 20px;
      background-color: #3b5c3b;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .upload-btn:hover {
      background-color: #2a3c2a;
    }
  </style>
</head>
<body>

  <h1>Upload Your Photos</h1>
  
  <!-- Featured photo section -->
  <div class="featured-photo">
    <h2>Featured Photo</h2>
    <img id="featuredPhoto" src="loading.jpg" alt="Featured Photo" />
  </div>

  <div class="upload-form">
    <input type="file" id="fileInput" />
    <button class="upload-btn" id="uploadBtn">Upload Photo</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getStorage, ref, listAll, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBBJJeHURGsBux3bUOZ0o1E9XrUr6etHBs",
      authDomain: "sarah-and-doug-2025.firebaseapp.com",
      projectId: "sarah-and-doug-2025",
      storageBucket: "sarah-and-doug-2025.firebasestorage.app",
      messagingSenderId: "1030871235471",
      appId: "1:1030871235471:web:40220c1c2a71082e2769fa",
      measurementId: "G-XJJL710JTX"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const photosRef = ref(storage, 'photos');

    const featuredPhoto = document.getElementById('featuredPhoto');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');

    // Load images and display a random featured photo
    async function loadFeaturedPhoto() {
      try {
        const result = await listAll(photosRef);
        const imageUrls = [];

        for (const itemRef of result.items) {
          const url = await getDownloadURL(itemRef);
          imageUrls.push(url);
        }

        if (imageUrls.length > 0) {
          const randomIndex = Math.floor(Math.random() * imageUrls.length);
          featuredPhoto.src = imageUrls[randomIndex];
        } else {
          featuredPhoto.src = 'no-photo.jpg'; // Fallback if no images are uploaded
        }
      } catch (error) {
        console.error("Error loading images: ", error);
        featuredPhoto.src = 'error.jpg'; // Fallback for error loading
      }
    }

    // Call the loadFeaturedPhoto function on page load
    loadFeaturedPhoto();

    // Upload functionality (this is just a placeholder for actual upload code)
    uploadBtn.addEventListener('click', () => {
      const file = fileInput.files[0];
      if (file) {
        // Upload logic (not implemented here)
        console.log('Uploading:', file);
      }
    });
  </script>

</body>
</html>
