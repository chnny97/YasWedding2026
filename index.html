<!DOCTYPE html>
<html>
<head>
  <title>Sarah & Doug 2026</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #005fcc;
    }

    .status {
      margin-top: 20px;
      font-size: 14px;
      color: #333;
    }

    a {
      display: block;
      margin-top: 30px;
      text-decoration: none;
      color: #007bff;
    }
  </style>
</head>
<body>
  <h1>Upload a Photo</h1>

  <!-- Hidden Inputs -->
  <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display: none;">
  <input type="file" accept="image/*" id="libraryInput" style="display: none;">

  <!-- Visible Buttons -->
  <button onclick="document.getElementById('cameraInput').click()">📷 Take a Photo</button>
  <button onclick="document.getElementById('libraryInput').click()">🖼 Choose from Library</button>

  <div class="status" id="status"></div>

  <a href="gallery.html">📸 View Uploaded Gallery</a>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getStorage, ref, uploadBytes } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const statusEl = document.getElementById('status');

    // Event listeners for both inputs
    document.getElementById('cameraInput').addEventListener('change', handleUpload);
    document.getElementById('libraryInput').addEventListener('change', handleUpload);

    async function handleUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const timestamp = new Date().toISOString();
      const fileRef = ref(storage, 'photos/' + timestamp + '_' + file.name);

      try {
        statusEl.textContent = 'Uploading...';
        await uploadBytes(fileRef, file);
        statusEl.textContent = '✅ Upload successful!';
      } catch (err) {
        console.error(err);
        statusEl.textContent = '❌ Upload failed.';
      }
    }
  </script>
</body>
</html>
