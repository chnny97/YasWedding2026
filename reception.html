<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reception</title>

  <!-- Google Fonts (serif headline + neutral sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Shared header and navigation styles -->
  <link rel="stylesheet" href="styles/common.css">

  <meta name="theme-color" content="#f4f1eb">

  <style>
    :root{
      --shadow: 0 6px 24px rgba(17,18,15,0.06);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      min-height:100%;
      font-family: 'Montserrat', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:var(--text);
      background: linear-gradient(180deg, var(--bg) 0%, var(--paper) 100%);
      padding: calc(var(--gutter) * 1.25);
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }

    .container{
      position:relative;
      z-index:2;
      max-width:var(--max-width);
      width:100%;
      margin:0 auto;
      text-align:center;
      padding: calc(var(--gutter) * 1.5) calc(var(--gutter) * 1.2);
    }

    .card{
      background:linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.55));
      border-radius:var(--radius);
      padding:calc(var(--gutter) * 0.9);
      box-shadow:var(--shadow);
      max-width:680px;
      margin:0 auto;
    }

    .menu-section{
      margin-bottom:20px;
      text-align:left;
    }

    .menu-section h3{
      font-family:'Playfair Display',serif;
      color:var(--accent-dark);
      letter-spacing:1.5px;
      margin:0 0 8px 0;
      font-size:1.2rem;
    }

    .menu-section ul{
      margin:0;
      padding:0;
      list-style: none;
      color:var(--muted);
      display:inline-block;
      text-align:center;
    }

    .menu-item{
      margin-bottom:6px;
      line-height:1.5;
    }

    .note{
      margin-top:12px;
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
    }

    @media (max-width:880px){
      .artwork{display:none}
      .container{padding:0}
      body{padding:24px}
    }
  </style>
</head>
<body>
  <div class="artwork left" aria-hidden="true"></div>
  <div class="artwork right" aria-hidden="true"></div>

  <main class="container">
    <header>
      <h1>YASMIN &amp; AARON</h1>
      <div class="lead">17 October 2026</div>

      <nav aria-label="Main">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="drinks.html">Drinks</a>
        <a href="reception.html" class="active" aria-current="page">Reception</a>
      </nav>
    </header>

    <section class="card">
      <div style="margin:0 auto;text-align:center">
        <div class="menu-section">
          <h3>Reception Outline</h3>
          <ul>
            <li class="menu-item">Commencement - 6pm</li>
            <li class="menu-item">Entrées 🥟</li>
            <li class="menu-item">Main Meals 🍽️</li>
            <li class="menu-item">Cake 🍰</li>
            <li class="menu-item">Time to Boogie 💃</li>
            <li class="menu-item">Bus Departs - 11pm</li>
          </ul>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
